# Render's free plan sleeps after ~15 min idle; ping so the live demo answers instantly.
# shortcut: GitHub disables scheduled workflows after 60 days without repo activity; re-enable in the Actions tab.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 https://am-shop-backend.onrender.com/health
